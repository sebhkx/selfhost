<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 805" width="100%" height="100%" style="background-color:#0b0f17; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f97316"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Canvas Frame -->
  <rect x="8" y="8" width="744" height="789" rx="12" fill="#0b0f17" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ========================================== -->
  <!-- 1. PROXMOX VE HYPERVISOR (CENTER TOP)     -->
  <!-- ========================================== -->
  <g transform="translate(230, 22)">
    <rect width="300" height="48" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="5" fill="#f97316"/>
    <text x="38" y="25" font-size="14" font-weight="700" fill="#f8fafc">Proxmox VE (pve)</text>
    <text x="38" y="40" font-size="11" font-weight="500" fill="#94a3b8">Hypervisor</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. DEBIAN VM (PRIMARY FOCUS)               -->
  <!-- ========================================== -->
  <g transform="translate(35, 88)">
    <!-- Debian VM Shell -->
    <rect width="690" height="485" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Header -->
    <circle cx="22" cy="20" r="4.5" fill="#38bdf8"/>
    <text x="36" y="24" font-size="14" font-weight="700" fill="#f0f9ff">Debian VM (dockhand)</text>

    <!-- Ingress Pipeline: Tailscale Serve -> Caddy -->
    <g transform="translate(20, 38)">
      <!-- Tailscale Serve -->
      <rect width="295" height="38" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
      <circle cx="18" cy="19" r="3.5" fill="#60a5fa"/>
      <text x="32" y="24" font-size="12" font-weight="600" fill="#f8fafc">Tailscale Serve</text>

      <!-- Arrow to Caddy -->
      <line x1="300" y1="19" x2="345" y2="19" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-blue)"/>

      <!-- Caddy Reverse Proxy -->
      <g transform="translate(350, 0)">
        <rect width="300" height="38" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.2"/>
        <circle cx="18" cy="19" r="3.5" fill="#38bdf8"/>
        <text x="32" y="24" font-size="12" font-weight="600" fill="#f8fafc">Caddy Reverse Proxy</text>
      </g>
    </g>

    <!-- Route from Caddy down to Dockhand UI -->
    <line x1="520" y1="76" x2="520" y2="90" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arr-blue)"/>

    <!-- Dockhand UI (Docker Management Interface) -->
    <g transform="translate(20, 92)">
      <rect width="650" height="44" rx="6" fill="#1e293b" stroke="#4f46e5" stroke-width="1.3"/>
      <circle cx="20" cy="22" r="4" fill="#818cf8"/>
      <text x="34" y="22" font-size="13" font-weight="700" fill="#f8fafc">Dockhand</text>
      <text x="110" y="22" font-size="12" font-weight="400" fill="#94a3b8">— Docker Management UI</text>
      <rect x="545" y="11" width="90" height="22" rx="4" fill="#0f172a"/>
      <text x="590" y="26" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Route: /</text>
    </g>

    <!-- Filebrowser Quantum & Containers -->
    <g transform="translate(20, 150)">
      <!-- Left Column: Filebrowser Quantum -->
      <g transform="translate(0, 0)">
        <rect width="255" height="312" rx="8" fill="#042f2e" stroke="#0d9488" stroke-width="1.4"/>
        <circle cx="20" cy="24" r="4" fill="#2dd4bf"/>
        <text x="34" y="24" font-size="13" font-weight="700" fill="#f8fafc">Filebrowser Quantum</text>
        <rect x="20" y="38" width="85" height="22" rx="4" fill="#0f172a"/>
        <text x="62" y="53" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle">Route: /fb</text>
        <text x="20" y="78" font-size="11" font-weight="600" fill="#5eead4">File Management</text>
        <text x="20" y="96" font-size="11" font-weight="400" fill="#94a3b8">Provides central file access</text>
        <text x="20" y="112" font-size="11" font-weight="400" fill="#94a3b8">to all container workspaces</text>
        <text x="20" y="128" font-size="11" font-weight="400" fill="#94a3b8">via host bind mounts.</text>

        <!-- Visual Bind Mount Storage Hub -->
        <rect x="20" y="146" width="215" height="150" rx="6" fill="#134e4a" fill-opacity="0.3" stroke="#14b8a6" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="127" y="215" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle">Bind Mount Storage Hub</text>
        <text x="127" y="235" font-size="10" font-weight="400" fill="#99f6e4" text-anchor="middle">Direct Workspace Access</text>
      </g>

      <!-- Single Bind Mount Arrow pointing to the right -->
      <line x1="255" y1="156" x2="335" y2="156" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#arr-teal)"/>
      <text x="295" y="147" font-size="10" font-weight="700" fill="#5eead4" text-anchor="middle">Bind Mount</text>

      <!-- Right Column: The 4 Dev Containers (Fluff removed) -->
      <g transform="translate(340, 0)">
        <!-- Container 1: VS Code Server -->
        <g transform="translate(0, 0)">
          <rect width="310" height="66" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
          <circle cx="18" cy="24" r="4" fill="#60a5fa"/>
          <text x="32" y="24" font-size="13" font-weight="700" fill="#f8fafc">VS Code Server</text>
          <rect x="195" y="13" width="105" height="22" rx="4" fill="#0f172a"/>
          <text x="247" y="28" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Route: /code</text>
          <text x="32" y="46" font-size="11" font-weight="400" fill="#94a3b8">Web IDE &amp; Workspace</text>
        </g>

        <!-- Container 2: JupyterLab -->
        <g transform="translate(0, 82)">
          <rect width="310" height="66" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
          <circle cx="18" cy="24" r="4" fill="#fbbf24"/>
          <text x="32" y="24" font-size="13" font-weight="700" fill="#f8fafc">JupyterLab</text>
          <rect x="185" y="13" width="115" height="22" rx="4" fill="#0f172a"/>
          <text x="242" y="28" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Route: /jupyter</text>
          <text x="32" y="46" font-size="11" font-weight="400" fill="#94a3b8">Python Notebooks</text>
        </g>

        <!-- Container 3: SciPy Notebook -->
        <g transform="translate(0, 164)">
          <rect width="310" height="66" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
          <circle cx="18" cy="24" r="4" fill="#fbbf24"/>
          <text x="32" y="24" font-size="13" font-weight="700" fill="#f8fafc">SciPy Notebook</text>
          <rect x="195" y="13" width="105" height="22" rx="4" fill="#0f172a"/>
          <text x="247" y="28" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Route: /scipy</text>
          <text x="32" y="46" font-size="11" font-weight="400" fill="#94a3b8">Scientific Computing</text>
        </g>

        <!-- Container 4: Marimo -->
        <g transform="translate(0, 246)">
          <rect width="310" height="66" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2"/>
          <circle cx="18" cy="24" r="4" fill="#a78bfa"/>
          <text x="32" y="24" font-size="13" font-weight="700" fill="#f8fafc">Marimo</text>
          <rect x="185" y="13" width="115" height="22" rx="4" fill="#0f172a"/>
          <text x="242" y="28" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Route: /marimo</text>
          <text x="32" y="46" font-size="11" font-weight="400" fill="#94a3b8">Reactive Notebooks</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 3. HOME ASSISTANT VM (COMPACT & BARE)     -->
  <!-- ========================================== -->
  <g transform="translate(35, 595)">
    <!-- Enclosing Subtle Box (Independent VM, No flow from Debian) -->
    <rect width="690" height="185" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>

    <!-- VM Header -->
    <circle cx="22" cy="20" r="4" fill="#38bdf8"/>
    <text x="36" y="24" font-size="13" font-weight="700" fill="#cbd5e1">Home Assistant VM (haos)</text>

    <!-- Components: Direct Link ONLY to ESP32 OTBR -->
    <g transform="translate(20, 38)">
      <!-- Home Assistant Core -->
      <g transform="translate(0, 0)">
        <rect width="155" height="50" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.2"/>
        <circle cx="18" cy="25" r="3.5" fill="#38bdf8"/>
        <text x="32" y="30" font-size="13" font-weight="600" fill="#f8fafc">Home Assistant</text>
      </g>

      <!-- Direct Link ONLY from Home Assistant to ESP32 OTBR -->
      <line x1="155" y1="25" x2="205" y2="25" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arr-purple)"/>

      <!-- ESP32-C6 (OTBR) -->
      <g transform="translate(210, 0)">
        <rect width="165" height="50" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
        <circle cx="18" cy="25" r="3.5" fill="#c084fc"/>
        <text x="32" y="30" font-size="13" font-weight="600" fill="#f8fafc">ESP32-C6 (OTBR)</text>
      </g>

      <!-- Thread radio from OTBR to GL.iNet Lafaer -->
      <line x1="375" y1="25" x2="455" y2="25" stroke="#c084fc" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr-purple)"/>
      <text x="415" y="17" font-size="10" font-weight="600" fill="#c084fc" text-anchor="middle">Thread radio</text>

      <!-- GL.iNet Lafaer (Presence Sensor) -->
      <g transform="translate(460, 0)">
        <rect width="190" height="50" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
        <circle cx="18" cy="25" r="3.5" fill="#34d399"/>
        <text x="32" y="23" font-size="12" font-weight="600" fill="#f8fafc">GL.iNet Lafaer</text>
        <text x="32" y="39" font-size="10" font-weight="500" fill="#6ee7b7">Presence Sensor (Wireless)</text>
      </g>

      <!-- TP-Link Tapo -->
      <g transform="translate(0, 74)">
        <!-- Link pointing UP towards Home Assistant -->
        <line x1="77" y1="0" x2="77" y2="-19" stroke="#14b8a6" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr-teal)"/>

        <rect width="240" height="46" rx="6" fill="#1e293b" stroke="#14b8a6" stroke-width="1.2"/>
        <circle cx="18" cy="23" r="3.5" fill="#2dd4bf"/>
        <text x="32" y="21" font-size="12" font-weight="600" fill="#f8fafc">TP-Link Tapo</text>
        <text x="32" y="36" font-size="10" font-weight="500" fill="#5eead4">Lights, plugs, hub and camera (Wifi)</text>
      </g>
    </g>
  </g>
</svg>
